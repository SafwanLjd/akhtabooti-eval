# Evaluation config v1. Run from the repository root:
#   akheval suite --config configs/eval-v1.toml
# Paths are relative to the repository root.
# Runs named dev-* use the dev split: two Core reference runs, the rest choose thresholds, routing and the MVP
# configuration.
# Every other run uses the test split and reports the configurations fixed on dev.

[project]
dataset = "datasets/akhtabooti-v1"
results = "reports/v1/runs"
tuning = "reports/v1/tuning"

# Detectors -------------------------------------------------------------------

# Core main as of 7 Oct 2026, the agreed baseline.
[detectors.core-main]
kind = "core-rules"
core_sha = "68d1749"

# Core main as of 1 Oct 2026, kept to measure what the 7 Oct commits changed.
[detectors.core-main-937e6ca]
kind = "core-rules"
core_sha = "937e6ca"

[detectors.core-release]
kind = "core-rules"
core_sha = "97c7afb"

# Locates IBAN, IP and UNHCR number values, as if the Core showed them the way it shows phones.
[detectors.core-proposed]
kind = "core-rules"
core_sha = "68d1749"
definitions = "rules/definitions-proposed.json"
located_categories = ["Email", "Phone Number", "IBAN", "IP Address", "UNHCR Number"]

[detectors.nym-small]
kind = "nym"
model_dir = "models/nym-pii-multilingual-small"
variant = "int8"
threshold = 0.5

[detectors.nym-edge]
kind = "nym"
model_dir = "models/nym-pii-multilingual-small"
variant = "edge-int8"
threshold = 0.55

[detectors.camelbert]
kind = "hf-token"
model = "models/camelbert-mix-ner"
labels = "camelbert"
threshold = 0.2

[detectors.dialogpii]
kind = "dialogpii"
model_dir = "models/dialogpii"
threshold = 0.55

[detectors.hybrid-small]
kind = "hybrid"
parts = ["core-proposed", "nym-small"]

[detectors.hybrid-edge]
kind = "hybrid"
parts = ["core-proposed", "nym-edge"]

# The hybrid as the brief words it (section 6.4): Core main rules unchanged, then Nym Small. Measures what the model
# adds to the Core as it is; the MVP hybrids use the proposed rules instead.
[detectors.hybrid-main-small]
kind = "hybrid"
parts = ["core-main", "nym-small"]

# Routed hybrids: the rules keep the pattern categories and UNHCR numbers, the model the contextual ones, national IDs
# and passports.
[detectors.hybrid-small-routed]
kind = "hybrid"
parts = ["core-proposed", "nym-small"]

[detectors.hybrid-small-routed.only]
core-proposed = ["EMAIL", "PHONE", "IBAN", "IP_ADDRESS", "REFUGEE_ID"]
nym-small = ["PERSON", "ORG", "LOCATION", "ADDRESS", "NATIONAL_ID", "PASSPORT"]

[detectors.hybrid-edge-routed]
kind = "hybrid"
parts = ["core-proposed", "nym-edge"]

[detectors.hybrid-edge-routed.only]
core-proposed = ["EMAIL", "PHONE", "IBAN", "IP_ADDRESS", "REFUGEE_ID"]
nym-edge = ["PERSON", "ORG", "LOCATION", "ADDRESS", "NATIONAL_ID", "PASSPORT"]

[detectors.regex-baseline]
kind = "regex-baseline"

# Extractors ------------------------------------------------------------------

[extractors.extractous]
kind = "extractous"

# The desktop app does not bundle tesseract; without it Tika returns no text for images and scanned PDFs.
[extractors.extractous-no-tesseract]
kind = "extractous"
tesseract = false

[extractors.tesseract-eng]
kind = "tesseract"
lang = "eng"

[extractors.tesseract-ara-eng]
kind = "tesseract"
lang = "ara+eng"

[extractors.ppocr-v6-small]
kind = "ppocr"
binary = "rust/ocr/bin/akh-ocr"
det = "models/ppocr/PP-OCRv6_small_det.mnn"
rec = "models/ppocr/PP-OCRv6_small_rec.mnn"
keys = "models/ppocr/ppocr_keys_v6_small.txt"

# OCR exactly as Core main 68d1749 runs it (src/file_utils.rs): PP-OCRv6 small detection, the Arabic PP-OCRv5
# recogniser, engine order, no bidi fix.
[extractors.ppocr-core-main]
kind = "ppocr"
binary = "rust/ocr/bin/akh-ocr"
det = "models/ppocr/PP-OCRv6_small_det.mnn"
rec = "models/ppocr/arabic_PP-OCRv5_mobile_rec_infer.mnn"
keys = "models/ppocr/ppocr_keys_arabic.txt"

[extractors.ppocr-v5-arabic]
kind = "ppocr"
binary = "rust/ocr/bin/akh-ocr"
det = "models/ppocr/PP-OCRv5_mobile_det.mnn"
rec = "models/ppocr/arabic_PP-OCRv5_mobile_rec_infer.mnn"
keys = "models/ppocr/ppocr_keys_arabic.txt"
order = "reading"
fix_rtl = true

# Arabic and English recognisers on the same boxes; the higher-confidence reading wins per box.
[extractors.ppocr-v5-arabic-en]
kind = "ppocr"
binary = "rust/ocr/bin/akh-ocr"
det = "models/ppocr/PP-OCRv5_mobile_det.mnn"
rec = ["models/ppocr/arabic_PP-OCRv5_mobile_rec_infer.mnn", "models/ppocr/en_PP-OCRv5_mobile_rec_infer.mnn"]
keys = ["models/ppocr/ppocr_keys_arabic.txt", "models/ppocr/ppocr_keys_en.txt"]
order = "reading"
fix_rtl = true

# Extraction for the MVP candidate: images go to `ocr`, PDFs to the text layer with `ocr` when it is near empty,
# other files to extractous. Choose `ocr` from the dev-extract-* runs. Tika runs no tesseract here, so a scanned
# PDF reaches `ocr`.
[extractors.mvp-extract]
kind = "pdf-ocr"
text = "extractous-no-tesseract"
ocr = "ppocr-v5-arabic-en"

# Pipelines: file -> extractor -> detector -------------------------------------

[pipelines."app-v0.1.0"]
detector = "core-release"
extractors = { default = "extractous" }

[pipelines."app-v0.1.0-no-tesseract"]
detector = "core-release"
extractors = { default = "extractous-no-tesseract" }

[pipelines.core-main]
detector = "core-main"
extractors = { default = "extractous", jpg = "ppocr-core-main", png = "ppocr-core-main" }

[pipelines.core-main-937e6ca]
detector = "core-main-937e6ca"
extractors = { default = "extractous", jpg = "ppocr-v6-small", png = "ppocr-v6-small" }

# Repoint the MVP candidate with two names: `detector` here and `ocr` in [extractors.mvp-extract].
[pipelines.mvp-candidate]
detector = "hybrid-small"
extractors = { default = "mvp-extract" }

# Dev runs: Core reference and selection --------------------------------------

# Core main, the baseline, and the release: reference rows for the selection runs below.
[[runs]]
name = "dev-text-core-main"
mode = "text"
split = "dev"
detector = "core-main"

