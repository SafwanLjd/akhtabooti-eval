candidate = "dev-text-hybrid-small-routed"

[[comparisons]]
name = "dev-hybrid-edge-vs-routed"
baseline = "dev-text-hybrid-edge"
candidate = "dev-text-hybrid-edge-routed"

# What the proposed rules add to the brief's hybrid of Core main rules and Nym Small.
[[comparisons]]
name = "dev-hybrid-main-small-vs-hybrid-small"
baseline = "dev-text-hybrid-main-small"
candidate = "dev-text-hybrid-small"

# On test, for the reports.

[[comparisons]]
name = "core-release-vs-core-main"
baseline = "text-core-release"
candidate = "text-core-main"

# What the Core's 7 Oct commits changed.
[[comparisons]]
name = "core-main-937e6ca-vs-68d1749"
baseline = "text-core-main-937e6ca"
candidate = "text-core-main"

[[comparisons]]
name = "pipeline-core-main-937e6ca-vs-68d1749"
