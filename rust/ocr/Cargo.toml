[package]
name = "akh-ocr"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
description = "Batch OCR through ocr-rs, the engine the Akhtabooti Core calls for images"
publish = false

[[bin]]
name = "akh-ocr"
path = "src/main.rs"

[dependencies]
image = "0.25"
libc = "0.2"
ocr-rs = "=2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
imageproc = "0.25"

[profile.release]
strip = true
